<!-- gym-owner.component.html -->
<div class="gym-owner-container">
  <!-- Top Navigation Bar -->
  <nav class="top-navbar">
    <div class="navbar-brand">GymPro</div>
    <ul class="nav-links">
      <li class="nav-item"><a routerLink="/d" routerLinkActive="active">Dashboard</a></li>
      <li class="nav-item"><a routerLink="/p" routerLinkActive="active">Programs</a></li>
      <li class="nav-item"><a routerLink="features/{{selectedGymId}}" routerLinkActive="active">Features</a></li>
      <li class="nav-item"><a routerLink="gym/{{selectedGymId}}/class" routerLinkActive="active">Classes</a></li>
      <li class="nav-item"><a routerLink="GymPendingCoach/{{selectedGymId}}" routerLinkActive="active">Pending Coaches</a></li>
    </ul>

    <!-- profile -->
    <div class="user-profile" (click)="toggleProfileDropdown()">
    </div>
  </nav>

  <!-- Sidebar with Gym List -->
  <aside class="gym-sidebar">
    <div class="sidebar-header">
      <h3>My Gyms</h3>
      <button class="add-gym-btn">
          <a routerLink="addGym" class="text-white" style="text-decoration: none;">
            <i class="fas fa-plus text-white"></i> Add Gym
          </a>
        </button>
    </div>

    <div class="gym-list">
      <div *ngFor="let gym of gyms" class="gym-item" [class.active]="selectedGymId === gym.id" (click)="selectGym(gym.id)">
        <div class="gym-info">
          <h4 class="text-black">{{gym.name}}</h4>
          <p class="gym-location">{{gym.address.city}}, {{gym.address.country}}</p>
        </div>
        <span class="gym-type-badge">{{gym.gymType}}</span>
      </div>
    </div>

    <div class="gym-actions" *ngIf="selectedGymId">
      <button class="edit-gym-btn">
        <a routerLink="gymDetail/{{selectedGymId}}" class="text-white" style="text-decoration: none;">
          <i class="fas fa-edit"></i> Edit Gym
        </a>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>
