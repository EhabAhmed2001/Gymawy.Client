<div class="trainee-details-container">
      <!-- Loading State -->
      <div *ngIf="loading" class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading trainee details...</p>
      </div>

      <!-- Error State -->
      <div *ngIf="error && !loading" class="error-container">
        <div class="error-icon">⚠️</div>
        <p class="error-text">{{ error }}</p>
        <button class="retry-btn" (click)="loadTraineeDetails()">Try Again</button>
      </div>

      <!-- Trainee Details -->
      <ng-container *ngIf="trainee && !loading && !error">
        <!-- Left Section - Trainee Data (1/3 width) -->
        <div class="trainee-info-section">
          <div class="trainee-card">
            <div class="trainee-image-container">
              <img
                [src]="trainee.imageUrl"
                [alt]="trainee.firstName + ' ' + trainee.lastName"
                class="trainee-image"
                (error)="onImageError($event)"
              >
            </div>

            <div class="trainee-details">
              <h2 class="trainee-name">
                {{ trainee.firstName }} {{ trainee.lastName }}
              </h2>

              <!-- <div class="detail-item">
                <span class="detail-label">Date of Birth:</span>
                <span class="detail-value">{{ formatDate(trainee.dateOfBirth) }}</span>
              </div> -->

              <div class="detail-item">
                <span class="detail-label">Age:</span>
                <span class="detail-value">{{ calculateAge(trainee.dateOfBirth) }} years</span>
              </div>

              <div class="detail-item">
                <span class="detail-label">Weight:</span>
                <span class="detail-value">{{ trainee.weight }} kg</span>
              </div>

              <div class="detail-item">
                <span class="detail-label">Reason for Joining:</span>
                <span class="detail-value reason">{{ trainee.reasonForJoining }}</span>
              </div>

               <div class="detail-item">
                <span class="detail-label">Gym:</span>
                <span class="detail-value">{{ trainee.gymName }}</span>
              </div>

            </div>
          </div>
        </div>

        <!-- Right Section - Action Buttons (2/3 width) -->
        <div class="actions-section">
          <div class="actions-container">
            <h3 class="actions-title">Quick Actions</h3>

            <div class="buttons-wrapper">
              <button
                class="action-btn diet-btn"
                (click)="onAssignDiet()"
                [disabled]="!trainee"
              >
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12h18m-9-9v18"/>
                </svg>
                <span>Assign Diet</span>
              </button>

              <button
                class="action-btn exercise-btn"
                (click)="onAssignExercises()"
                [disabled]="!trainee"
              >
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 9h6 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2z"/>
                  <path d="M12 1v6m0 6v6"/>
                </svg>
                <span>Assign Exercises</span>
              </button>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
