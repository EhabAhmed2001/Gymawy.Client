<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Approval Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff0000, #cc0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .gym-approval-table {
            width: 100%;
            border-collapse: collapse;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.15);
        }

        .gym-approval-table thead {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            position: relative;
        }

        .gym-approval-table thead::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff0000, transparent);
        }

        .gym-approval-table th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 1.1rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .gym-approval-table th:last-child {
            border-right: none;
        }

        .gym-approval-table tbody tr {
            background: rgba(26, 26, 26, 0.8);
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(255, 0, 0, 0.1);
        }

        .gym-approval-table tbody tr:hover {
            background: rgba(255, 0, 0, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }

        .gym-approval-table tbody tr:nth-child(even) {
            background: rgba(40, 40, 40, 0.6);
        }

        .gym-approval-table tbody tr:nth-child(even):hover {
            background: rgba(255, 0, 0, 0.15);
        }

        .gym-approval-table td {
            padding: 16px 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
            font-size: 0.95rem;
            color: #e0e0e0;
        }

        .gym-approval-table td:last-child {
            border-right: none;
        }

        .description-cell {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
        }

        .description-cell:hover {
            overflow: visible;
            white-space: normal;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            position: relative;
            border-radius: 5px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .btn-accept, .btn-reject, .btn-details {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            margin: 2px;
        }

        .btn-accept {
            background: linear-gradient(45deg, #ff0000, #cc0000);
            color: #ffffff;
            border: 2px solid transparent;
        }

        .btn-accept:hover {
            background: linear-gradient(45deg, #cc0000, #990000);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }

        .btn-reject {
            background: transparent;
            color: #ff0000;
            border: 2px solid #ff0000;
        }

        .btn-reject:hover {
            background: #ff0000;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }

        .btn-details {
            background: linear-gradient(45deg, #333333, #1a1a1a);
            color: #ffffff;
            border: 2px solid #666666;
        }

        .btn-details:hover {
            background: linear-gradient(45deg, #666666, #333333);
            border-color: #ff0000;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.2);
        }

        .btn-accept::before,
        .btn-reject::before,
        .btn-details::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-accept:hover::before,
        .btn-reject:hover::before,
        .btn-details:hover::before {
            left: 100%;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .gym-approval-table {
                font-size: 0.8rem;
            }
            
            .gym-approval-table th,
            .gym-approval-table td {
                padding: 10px 8px;
            }
            
            .btn-accept, .btn-reject, .btn-details {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            
            .title {
                font-size: 2rem;
            }
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #333 25%, #555 50%, #333 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <table class="gym-approval-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Description</th>
                    <th>Gym Type</th>
                    <th colspan="3">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let gym of pendingGyms">
                    <td>{{gym.name}}</td>
                    <td>{{gym.phone}}</td>
                    <td class="description-cell">{{gym.description}}</td>
                    <td>{{gym.gymType}}</td>
                    <td><button class="btn-accept" (click)="HandelRequest(gym.gymId,true)">Accept</button></td>
                    <td><button class="btn-reject" (click)="HandelRequest(gym.gymId,false)">Reject</button></td>    
                    <td><button class="btn-details" (click)="GetGymDetails(gym.gymId)" >Details</button></td>    
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
