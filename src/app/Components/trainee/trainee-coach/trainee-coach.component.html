<!-- coach-details.component.html -->
<div class="container py-5">
  <div class="row">
    <!-- Coach Profile Card -->
  @if (coach != null) {
    <div class="col-lg-8 mx-auto">
      <div class="card shadow-lg">
        <div class="card-body p-4">
          <div class="row align-items-center">
            <!-- Coach Image -->
            <div class="col-md-4 text-center">
              <img
                [src]="coach?.imageUrl"
                alt="{{ coach?.firstName }} {{ coach?.lastName }}"
                class="img-fluid rounded-circle mb-3 mb-md-0"
                style="
                  width: 180px;
                  height: 180px;
                  object-fit: cover;
                  border: 4px solid #4361ee;
                "
              />
            </div>

            <!-- Coach Info -->
            <div class="col-md-8">
              <h2 class="fw-bold mb-1">
                {{ coach?.firstName }} {{ coach?.lastName }}
              </h2>
              <p class="text-muted mb-3">Your Personal Coach</p>

              <div class="d-flex flex-wrap gap-2 mb-3">
                <span
                  class="badge bg-primary bg-opacity-10 text-primary py-2 px-3"
                >
                  <i class="bi bi-star-fill me-1"></i> Certified Trainer
                </span>
              </div>

              <div class="mb-3">
                <h5 class="fw-bold mb-2">About Coach</h5>
                <p class="text-muted">{{ coach?.about }}</p>
              </div>
            </div>
          </div>
        
        </div>
      </div>

      <!-- Coach Stats -->
      <div class="row mt-4">
        <div class="col-md-12 mb-3">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body text-center">
              <h3 class="fw-bold text-primary">{{coach?.traineeCount}}</h3>
              <p class="text-muted mb-0">Active Trainees</p>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-5">
        <button class="col-md-6 btn btn-primary">
          <i class="bi bi-calendar-check me-2"></i>Your Schedule Exercises
        </button>
        <button class="col-md-6 btn btn-outline-secondary">
          <i class="bi bi-journal-text me-2"></i>Your Diet Plan
        </button>
      </div>

    </div>
  }
  @else {
    <div class="col-lg-8 mx-auto">
      <div class="alert alert-warning text-center">
        <strong>No coach assigned yet!</strong> Please wait for your coach to be assigned.
      </div>
    </div>
  }
  </div>

  @if (coach != null) {

  <!-- Floating Chat Button -->
  <!-- [routerLink]="['/members',coach.userName]" [queryParams]="{tab:'Messages'}" -->
  <!-- [routerLink]="['/members','bob']" [queryParams]="{tab:'Messages'}" -->
  <button
    [routerLink]="['/members',coach.userName]" [queryParams]="{tab:'Messages'}"
    class="btn btn-primary rounded-circle position-fixed"
    style="
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
    "
    title="Start chat "
  >
    <i class="bi bi-chat-dots fs-4"></i>
  </button>

  <button
  [routerLink]="['/video-call']"
  class="btn btn-primary rounded-circle position-fixed"
  style="
    bottom: 100px;
    right: 30px;
    width: 60px;
    height: 60px;
    box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
  "
  title="Start Video Call"
  *ngIf="user.role === 'Coach'"
>
  <i class="bi bi-camera-video-fill fs-4"></i>
</button>


}
</div>
