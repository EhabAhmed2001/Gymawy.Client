<!-- edit-profile.component.html -->
<div class="profile-edit-container">
  <div class="profile-header">
    <h1 class="text-white">Edit Your Profile</h1>
    <p class="subtitle text-red-light">Update your personal information</p>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <!-- Profile Picture -->
    <div class="avatar-upload">
      <div class="avatar-preview" [style.backgroundImage]="'url(' + (imagePreview || 'assets/default-avatar.png') + ')'">
        <label for="avatarUpload" class="upload-overlay">
          <i class="bi bi-camera text-white"></i>
          <span class="text-white">Change Photo</span>
        </label>
      </div>
      <input id="avatarUpload" type="file" accept="image/*" (change)="onImageChange($event)" class="d-none">
    </div>

    <!-- Personal Info -->
    <div class="form-section">
      <h2 class="section-title text-white">Personal Information</h2>
      
      <div formGroupName="personalInfo">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">First Name*</label>
              <input type="text" formControlName="firstName" placeholder="First Name" class="bg-dark text-white">
              <div class="error-message" *ngIf="profileForm.get('personalInfo.firstName')?.invalid && 
                   profileForm.get('personalInfo.firstName')?.touched">
                First name is required
              </div>
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">Last Name*</label>
              <input type="text" formControlName="lastName" placeholder="Last Name" class="bg-dark text-white">
              <div class="error-message" *ngIf="profileForm.get('personalInfo.lastName')?.invalid && 
                   profileForm.get('personalInfo.lastName')?.touched">
                Last name is required
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">Date of Birth</label>
              <input type="date" formControlName="dateOfBirth" class="bg-dark text-white">
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">Phone Number</label>
              <input type="tel" formControlName="phoneNumber" placeholder="phone number" class="bg-dark text-white">
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">Weight (kg)</label>
              <input type="number" formControlName="weight" step="1" class="bg-dark text-white">
              <div class="error-message" *ngIf="profileForm.get('personalInfo.weight')?.errors?.['min']">
                Minimum weight is 30kg
              </div>
              <div class="error-message" *ngIf="profileForm.get('personalInfo.weight')?.errors?.['max']">
                Maximum weight is 300kg
              </div>
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">Reason for Joining</label>
              <textarea formControlName="reasonForJoining" rows="2" placeholder="Reason For Joining" class="bg-dark text-white"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Address -->
    <div class="form-section">
      <h2 class="section-title text-white">Address Information</h2>
      
      <div formGroupName="address">
        <div class="row">
          <div class="col-md-12">
            <div class="form-group">
              <label class="text-white">Street</label>
              <input type="text" formControlName="street" placeholder="Street" class="bg-dark text-white">
            </div>
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">City</label>
              <input type="text" formControlName="city" placeholder="City" class="bg-dark text-white">
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label class="text-white">Country</label>
              <input type="text" formControlName="country" placeholder="Country" class="bg-dark text-white">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" 
              class="btn btn-outline-red"
              (click)="onCancel()"
              [disabled]="isLoading">
        Cancel
      </button>
      <button type="submit" 
              class="btn btn-red"
              [disabled]="profileForm.invalid || isLoading">
        <span *ngIf="!isLoading">Save Changes</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin"></i> Saving...
        </span>
      </button>
    </div>
  </form>
</div>
