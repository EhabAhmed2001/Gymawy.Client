<!-- edit-profile.component.html -->
<div class="profile-edit-container">
  <div class="profile-header">
    <h1>Edit Your Profile</h1>
    <p class="subtitle">Update your personal information</p>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <!-- Profile Picture -->
    <div class="avatar-upload">
      <div class="avatar-preview" [style.backgroundImage]="'url(' + (imagePreview || 'assets/default-avatar.png') + ')'">
        <label for="avatarUpload" class="upload-overlay">
          <i class="bi bi-camera"></i>
          <span>Change Photo</span>
        </label>
      </div>
      <input id="avatarUpload" type="file" accept="image/*" (change)="onImageChange($event)" class="d-none">
    </div>

    <!-- Personal Info -->
    <div class="form-section">
      <h2 class="section-title">Personal Information</h2>
      
      <div formGroupName="personalInfo">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>First Name*</label>
              <input type="text" formControlName="firstName" placeholder="First Name">
              <div class="error-message" *ngIf="profileForm.get('personalInfo.firstName')?.invalid && 
                   profileForm.get('personalInfo.firstName')?.touched">
                First name is required
              </div>
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label>Last Name*</label>
              <input type="text" formControlName="lastName" placeholder="Last Name">
              <div class="error-message" *ngIf="profileForm.get('personalInfo.lastName')?.invalid && 
                   profileForm.get('personalInfo.lastName')?.touched">
                Last name is required
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>Date of Birth</label>
              <input type="date" formControlName="dateOfBirth">
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" formControlName="phoneNumber" placeholder="phone number">
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>Weight (kg)</label>
              <input type="number" formControlName="weight" step="1">
              <div class="error-message" *ngIf="profileForm.get('personalInfo.weight')?.errors?.['min']">
                Minimum weight is 30kg
              </div>
              <div class="error-message" *ngIf="profileForm.get('personalInfo.weight')?.errors?.['max']">
                Maximum weight is 300kg
              </div>
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label>Reason for Joining</label>
              <textarea formControlName="reasonForJoining" rows="2" placeholder="Reason For Joining"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Address -->
    <div class="form-section">
      <h2 class="section-title">Address Information</h2>
      
      <div formGroupName="address">
        <div class="row">
          <div class="col-md-12">
            <div class="form-group">
              <label>Street</label>
              <input type="text" formControlName="street" placeholder="Street">
            </div>
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>City</label>
              <input type="text" formControlName="city" placeholder="City">
            </div>
          </div>
          
          <div class="col-md-6">
            <div class="form-group">
              <label>Country</label>
              <input type="text" formControlName="country" placeholder="Country">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button type="button" 
              class="btn btn-outline-secondary"
              (click)="onCancel()"
              [disabled]="isLoading">
        Cancel
      </button>
      <button type="submit" 
              class="btn btn-primary"
              [disabled]="profileForm.invalid || isLoading">
        <span *ngIf="!isLoading">Save Changes</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin"></i> Saving...
        </span>
      </button>
    </div>


  </form>
</div>
